  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

m: scale(1); opacity: 1; } }\n  @keyframes bfbToast { 0% { transform: translateY(8px); opacity: 0; } 12% { transform: translateY(0); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }\n  @keyframes bfbFade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes bfbSwing { 0%, 100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }\n  @keyframes bfbClap { 0%, 100% { transform: translateX(-13px); } 50% { transform: translateX(13px); } }\n  @keyframes bfbShake { 0%, 100% { transform: translate(-5px, 0) rotate(-3deg); } 50% { transform: translate(5px, 0) rotate(3deg); } }\n  @keyframes bfbRipple { 0% { transform: scale(0.5); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }\n  @keyframes bfbGlow { 0%, 100% { opacity: 0.3; transform: scaleY(0.94); } 50% { opacity: 1; transform: scaleY(1); } }\n  @keyframes bfbTick { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }\n  @keyframes bfbNoteRainbow { from { filter: hue-rotate(0deg) saturate(1.6); } to { filter: hue-rotate(360deg) saturate(1.6); } }\n  @keyframes bfbCycleBg { 0% { background-color: #FFF6D6; } 20% { background-color: #E4F3E8; } 40% { background-color: #FDE7D6; } 60% { background-color: #E2ECF8; } 80% { background-color: #F1E6F8; } 100% { background-color: #FFF6D6; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: {{ appBg }}; padding-bottom: 72px; transition: background 200ms ease;\">\n\n  <!-- ==================== CLASS RACE STRIP ==================== -->\n  <div style=\"position: relative; z-index: 90; background: {{ appBg }}; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 24px 16px;\">\n    <div style=\"max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n        <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #FFFFFF;\">Today's class race<\u002Fspan>\n        <span style=\"font-size: 13px; font-weight: 700; color: #5CE1E6;\">{{ raceSummary }}<\u002Fspan>\n        <span style=\"flex: 1 1 auto;\"><\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ onToggleTheme }}\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px; border-radius: 999px; border: 1.5px solid rgba(0,0,0,0.14); background: #1A1238; color: #F1ECFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.08);\" style-hover=\"background: #241A4A;\">\n          <span style=\"width: 14px; height: 14px; border-radius: 999px; background: {{ headerBg }}; box-shadow: 0 0 0 2px {{ accentStripe }};\"><\u002Fspan>{{ themeToggleLabel }}\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px;\">\n        <sc-for list=\"{{ classCards }}\" as=\"k\" hint-placeholder-count=\"3\">\n          <button type=\"button\" sc-camel-on-click=\"{{ k.onPick }}\" style=\"position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 7px; padding: 12px 14px; border-radius: 14px; border: 2px solid {{ k.ring }}; background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)), #1A1238; color: #FFFFFF; text-align: left; cursor: pointer; box-shadow: {{ k.shadow }}; transition: transform 160ms ease, box-shadow 160ms ease;\" style-hover=\"transform: translateY(-2px);\">\n            <div style=\"display: flex; align-items: center; gap: 8px;\">\n              <span style=\"flex: 1 1 auto; min-width: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ k.name }}<\u002Fspan>\n              <span style=\"flex: none; padding: 2px 9px; border-radius: 999px; background: {{ k.rankBg }}; color: {{ k.rankFg }}; font-size: 11px; font-weight: 800;\">{{ k.rankLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 8px;\">\n              <span style=\"width: 10px; height: 10px; flex: none; border-radius: 999px; background: {{ k.accent }}; box-shadow: 0 0 8px {{ k.accent }};\"><\u002Fspan>\n              <span style=\"padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,0.45); font-size: 12px; font-weight: 800;\">{{ k.pts }} pts today<\u002Fspan>\n              <sc-if value=\"{{ k.isRecord }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"padding: 2px 8px; border-radius: 999px; background: #FFD84D; color: #2A1A00; font-size: 10px; font-weight: 800; text-transform: uppercase;\">★ Record<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"height: 6px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden;\">\n              <div style=\"height: 100%; width: {{ k.bar }}; border-radius: 999px; background: linear-gradient(90deg, #FF3DF0, {{ k.accent }}); box-shadow: 0 0 8px {{ k.accent }}; transition: width 300ms ease;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 11px; font-weight: 700; color: #B9AEE0;\">{{ k.gapLabel }}<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 12px; font-weight: 700; color: #D8D0F5;\">\n              <span>🏆 Best <strong style=\"color: #FFD84D;\">{{ k.best }}<\u002Fstrong><\u002Fspan>\n              <span>⏱ Today <strong style=\"color: #39FF88;\">+{{ k.pts }}<\u002Fstrong><\u002Fspan>\n              <span>⭐ Total <strong style=\"color: #FFFFFF;\">{{ k.total }}<\u002Fstrong><\u002Fspan>\n              <span>👥 <strong style=\"color: #FFFFFF;\">{{ k.count }}<\u002Fstrong> students<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ themeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: relative; z-index: 91; background: #1A1238; border-bottom: 1.5px solid #3B2F6B; padding: 16px 24px 20px;\">\n      <div style=\"max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\">\n          <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; color: #F1ECFF;\">Theme for {{ activeName }}<\u002Fspan>\n          <span style=\"font-size: 12px; font-weight: 600; color: #9A8FC4;\">Saved to this class — switching classes re-themes everything.<\u002Fspan>\n          <span style=\"flex: 1 1 auto;\"><\u002Fspan>\n          <input value=\"{{ themeNameInput }}\" sc-camel-on-change=\"{{ onThemeNameChange }}\" placeholder=\"Custom theme name (optional)\" style=\"flex: 0 1 240px; min-width: 160px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1.5px solid #4A3D80; font-size: 14px; font-weight: 700;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onThemeClear }}\" style=\"min-height: 36px; padding: 0 12px; border-radius: 999px; border: none; background: transparent; color: #B9AEE0; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline;\">Reset to default<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onToggleTheme }}\" style=\"min-height: 36px; padding: 0 16px; border-radius: 999px; border: none; background: #17251C; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer;\">Done<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;\">\n          <sc-for list=\"{{ themePresets }}\" as=\"p\" hint-placeholder-count=\"12\">\n            < if value=\"{{ hasLegend }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #1A1238; border: 1.5px solid #33285E;\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;\">\n              <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #B9AEE0;\">Dot legend<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 600; color: #9A8FC4;\">Naming a colour is optional.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px;\">\n              <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"0\">\n                <div style=\"display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: #241A4A;\">\n                  <span style=\"width: 16px; height: 16px; flex: none; border-radius: 999px; border: 1.5px solid rgba(0,0,0,0.14); background: {{ l.color }};\"><\u002Fspan>\n                  <input value=\"{{ l.label }}\" sc-camel-on-change=\"{{ l.onLabel }}\" aria-label=\"Name this colour\" placeholder=\"Name this colour…\" style=\"flex: 1 1 auto; min-width: 0; min-height: 34px; padding: 0 8px; border-radius: 8px; border: 1.5px solid transparent; background: #1A1238; font-size: 13px; font-weight: 700;\" style-focus=\"border-color: #5CE1E6;\">\n                  <span style=\"flex: none; font-size: 12px; font-weight: 800; color: #B9AEE0;\">{{ l.count }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasConflictWarning }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; gap: 10px; padding: 11px 14px; border-radius: 10px; background: #FBEFD3; border: 1.5px soli ywhere; white-space: normal; line-height: 1.2; color: #F1ECFF; opacity: {{ m.nameOp }}; text-decoration: {{ m.nameDeco }};\">{{ m.name }}<\u002Fspan>\n                        <sc-if value=\"{{ m.isLeader }}\" hint-placeholder-val=\"{{ false }}\">\n                          <svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" title=\"Leader\" style=\"width: 18px; height: 18px; flex: none;\"><path d=\"M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-1.7 10H4.7z\" fill=\"#F7C24B\" stroke=\"#B98A12\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fsc-if>\n                      <\u002Fbutton>\n                      <span style=\"flex: none; white-space: nowrap; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; color: #5CE1E6;\">{{ m.xp }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ m.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; padding: 10px; border-radius: 10px; background: #241A4A; border: 1.5px solid #3B2F6B;\">\n                        <label style=\"flex: 1 1 140px; display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #9A8FC4;\">Name\n                          <input value=\"{{ m.editName }}\" sc-camel-on-change=\"{{ m.onEditName }}\" style=\"min-height: 34px; padding: 0 8px; border-radius: 8px; border: 1.5px solid #3B2F6B; background: #1A1238; color: #F1ECFF; font-size: 14px; font-weight: 700; letter-spacing: 0; text-transform: none;\">\n                        <\u002Flabel>\n                        <label style=\"flex: none; width: 70px; display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #9A8FC4;\">Today\n                          <input value=\"{{ m.editDaily }}\" sc-camel-on-change=\"{{ m.onE pace-between; gap: 12px; flex-wrap: wrap;\">\n            <div>\n              <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.015em;\">Daily report<\u002Fh2>\n              <p style=\"margin: 4px 0 0; font-size: 14px; color: #B9AEE0;\">{{ activeName }} · who gained or lost, with a quick word for each.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap;\">\n              <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #B9AEE0;\">PIN<\u002Fspan>\n              <input value=\"{{ reportPinSetting }}\" sc-camel-on-change=\"{{ onReportPinSetting }}\" maxlength=\"8\" style=\"width: 74px; min-height: 34px; padding: 0 8px; border-radius: 8px; border: 1.5px solid #3B2F6B; text-align: center; font-size: 13px; font-weight: 700;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ onReportUpdate }}\" style=\"min-height: 40px; padding: 0 18px; border-radius: 999px; border: none; background: #2C6BAF; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #3d7fc4;\">Update today's report<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onExportProgress }}\" title=\"CSV: total, this week, this month, normal week, flag\" style=\"min-height: 40px; padding: 0 18px; border-radius: 999px; border: none; background: #A8D84C; color: #1A1238; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #bce35f;\">Export progress (CSV)<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ onReportLock }}\" style=\"min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #3B2F6B; background: transparent; color: #B9AEE0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;\">Lock<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding: 12px 16px; border-radius: 12px; background: #140D2E; border: 1.5px solid #3B2F6B; font-size: 13px; font-weight: 700; color: #5CE1E6;\">{{ weeklyTotalLabel }}<\u002Fdiv>\n\n          <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 14px; max-height: 640px; overflow: auto;\">\n              <sc-for list=\"{{ historyDays }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <div style=\"border: 1.5px solid #3B2F6B; border-radius: 14px; padding: 16px;\">\n                  <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;\">\n                    <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800;\">{{ d.date }}<\u002Fspan>\n                    <span style=\"font-size: 12px; font-weight: 700; color: #9A8FC4;\">{{ d.meta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                    <sc-for list=\"{{ d.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                      <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: {{ r.rowBg }}; flex-wrap: wrap;\">\n                        <span style=\"flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ r.name }}<\u002Fspan>\n                        <span style=\"flex: none; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 800; color: {{ r.deltaColor }};\">{{ r.deltaLabel }}<\u002Fspan>\n                        <span style=\"flex: none; width: 190px; text-align: right; font-size: 13px; font-weight: 700; color: {{ r.deltaColor }};\">{{ r.feedback }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding: 26px; border-radius: 14px; border: 1.5px dashed #4A3D80; text-align: center; font-size: 14px; font-weight: 600; color: #B9AEE0;\">No report yet — press <span style=\"color: #2C6BAF;\">Update today's report<\u002Fspan> to log today.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section id=\"sec-import\" style=\"scroll-margin-top: 130px;\">\n      <sc-if value=\"{{ noClasses }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width: 560px; margin: 40px auto; padding: 28px; border-radius: 16px; background: #1A1238; border: 1.5px solid #3B2F6B; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;\">\n          <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; color: #F1ECFF;\">No classes with students found<\u002Fh2>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #B9AEE0;\">{{ teacherEmail }} has no active classes with students in Ribbit Rabbit. Add or restore them there, then reload.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ onReload }}\" style=\"min-height: 36px; padding: 0 14px; border-radius: 999px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; min-height: 44px; padding: 0 22px; border: none; background: #7C3AED; color: #F4FAF4;\">Reload from Supabase<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <!-- ==================== ROSTER DRAWER ==================== -->\n    <sc-if value=\"{{ loaded ot;string&quot;, &quot;section&quot;: &quot;Game&quot; },\n  &quot;groupAwardPoints&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 15, &quot;min&quot;: 1, &quot;max&quot;: 100, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Groups&quot; },\n  &quot;defaultGroupSize&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 4, &quot;min&quot;: 2, &quot;max&quot;: 10, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Groups&quot; },\n  &quot;showMascot&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Branding&quot; }\n}\">\nconst CLS_COLORS = ['#2E8B5E','#F2762E','#2C6BAF','#D64550','#8B5FBF','#E8A62B','#0E9A8A','#B4762E'];\n/* Relative luminance so group headers put dark text on the light swatches (yellow/orange/teal). */\nfunction isLightHex(hex) {\n  const h = String(hex || '').replace('#', '');\n  if (h.length !== 6) return false;\n  const c = [0, 2, 4].map(i => {\n    const v = parseInt(h.slice(i, i + 2), 16) / 255;\n    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);\n  });\n  return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) > 0.21;\n}\nconst NOTE_COLORS = [\n  { bg: '#2A2410', head: '#3D3416', border: '#FFD84D' },\n  { bg: '#0F2A1C', head: '#163D29', border: '#39FF88' },\n  { bg: '#2E1A10', head: '#432616', border: '#FF7A3D' },\n  { bg: '#0F1E36', head: '#172C4E', border: '#5CE1E6' },\n  { bg: '#26103A', head: '#371852', border: '#FF3DF0' }\n];\nconst KEY = 'bfb-leadership-v1';\n/* First 6 = Power Ranger role colors, auto-assigned to every student on load */\nconst DOT_COLORS = [\n  '#D64550','#2C6BAF','#F0C33B','#E85D9E','#2E8B5E','#3A3A3A',\n  '#E2622C','#E8951F','#A8B520','#12977F','#1B8FA8','#4A5AC0','#7452C8','#9E4BB8','#C43F92','#C93F63',\n  '#F09A8E','#F5B48C','#F5CE8A','#EDDE86','#CFDD93','#A7D28E','#8CCBA9','#84D0C4','#8FCADD','#9DB9E4','#AEB4EC','#C1AEEE','#D4A8E4','#E9A5CE','#EDA3B6'\n];\nconst SUPABASE_URL = 'https://aiczpuoskwzqtzvoomll.supabase.co';\nconst SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpY3pwdW9za3d6cXR6dm9vbWxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzczNjgsImV4cCI6MjEwNDQxMzM2OH0.ttZE_4PrGb7qCJjcOKdahv4lH02JrWR4BpePsXC4gpA';\n/* Students, classes and groups are loaded live from the shared Ribbit Rabbit project. Names are decrypted in the browser and never stored. */\nconst TBL = { profiles: 'beta_profiles', classes: 'classes', students: 'beta_students', groups: 'leader_groups', history: 'leader_history' };\nconst SESSION_CACHE_KEY = 'bfb-leadership-local-v1';\nconst LOCAL_KEY = 'bfb-student-local-v2';\nconst NAMESRC_KEY = 'bfb-ll-namesrc';\nconst AUTO_SYNC_MS = 60000;\n/* Ribbit Rabbit may mark a removed class/student in different ways; treat any of them as gone. Returns the reason or null. */\nfunction whyHidden(r) {\n  if (!r) return null;\n  const on = v => v === true || v === 1 || v === 'true' || v === 't';\n  for (const k of ['archived', 'is_archived', 'deleted', 'is_deleted', 'hidden', 'is_hidden', 'removed']) if (on(r[k])) return k;\n  for (const k of ['deleted_at', 'archived_at', 'removed_at']) if (r[k]) return k;\n  for (const k of ['status', 'state']) if (typeof r[k] === 'string' && /^(archived|deleted|removed|inactive|hidden|trashed)$/i.test(r[k])) return k + '=' + r[k];\n  for (const k of ['active', 'is_active']) if (r[k] === false || r[k] === 'false') return k + '=false';\n  return null;\n}\nfunction nameTokens(s) { return String(s || '').toLowerCase().replace(/[^a-z\\u00C0-\\u024F\\s]/g, ' ').split(/\\s+/).filter(Boolean); }\nfunction sameName(a, b) {\n  const x = nameTokens(a), y = nameTokens(b);\n  const [small, big] = x.length <= y.length ? [x, y] : [y, x];\n  return small.every(w => big.indexOf(w) >= 0);\n}\nconst MANAGE_MSG = 'Classes and students are managed in Ribbit Rabbit \\u2014 this app loads them live.';\nfunction errText(e) { return (e && (e.message || e.error_description)) || String(e); }\n/* Shared XP backend: this app's running total goes to app_xp; combined totals come from student_xp_totals. */\nconst XP_APP_SOURCE = 'ribbit_rabbit';\nconst UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;\nconst isUuid = id => UUID_RE.test(String(id || ''));\nconst INSTR_KEY = 'bfb-leadership-instructions-v1';\nconst INSTR_TEXT_COLORS = ['#17251C', '#C9402F', '#E8951F', '#17603F', '#2C6BAF', '#8B5FBF'];\nconst INSTR_HI_COLORS = ['#FFF1A8', '#CDEFD8', '#FAD4E0', '#D6E6FA'];\nfunction b64ToBuf(b64) { const bin = atob(b64); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); return buf.buffer; }\nfunction bufToB64(buf) { let bin = ''; const bytes = new Uint8Array(buf); for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }\nasync function deriveKey(passphrase, saltB64) {\n  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);\n  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64ToBuf(saltB64), iterations: 100000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);\n}\n/* Encrypted fields are JSON {iv, data} (both base64). Returns null if empty or undecryptable. */\nasync function decryptField(key, v) {\n  if (v == null || v === '') return null;\n  try {\n    const o = typeof v === 'string' ? JSON.parse(v) : v;\n    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(o.iv) }, key, b64ToBuf(o.data));\n    return new TextDecoder().decode(pt);\n  } catch (e) { return null; }\n}\nconst ALARM_LABELS = { bell: 'School bell', chime: 'Soft chime', clock: 'Alarm clock', gong: 'Gong' };\nconst ALARM_MS = { bell: 2600, chime: 2200, clock: 2200, gong: 3400 };\nconst THEME_COLORS = [\n  { name: 'Amber', hex: '#F7C24B' }, { name: 'Orange', hex: '#E8951F' }, { name: 'Red', hex: '#C9402F' },\n  { name: 'Coral', hex: '#E2622C' }, { name: 'Gold', hex: '#D8B215' }, { name: 'Olive', hex: '#A8B520' },\n  { name: 'Green', hex: '#5FA02A' }, { name: 'Forest', hex: '#2E8B5E' }, { name: 'Teal', hex: '#12977F' },\n  { name: 'Sky', hex: '#1B8FA8' }, { name: 'Blue', hex: '#2C6BAF' }, { name: 'Indigo', hex: '#5B6FD8' },\n  { name: 'Violet', hex: '#9B6FD8' }, { name: 'Magenta', hex: '#C15FC0' }, { name: 'Pink', hex: '#D85FA0' },\n  { name: 'Slate', hex: '#8A9689' }\n];\nconst THEME_PRESETS = [\n  ['neon','Neon Night','#1B1040','#FF3DF0','#0E0820'],['cyber','Cyber Cyan','#0B1E33','#5CE1E6','#060F1C'],['arcade','Retro Arcade','#140B2E','#39FF88','#0A0618'],\n  ['synth','Synthwave','#2A0E45','#FF7A3D','#12061F'],['laser','Laser Lime','#0F1F14','#B8FF3D','#07100A'],['ultra','Ultraviolet','#22114F','#A06BFF','#0F0828'],\n  ['tokyo','Tokyo Lights','#2B0B2E','#FF4F8B','#120414'],['ice','Ice Blaster','#0C2236','#7FD8FF','#06121E'],['gold','Gold Rush','#241A05','#FFD84D','#110C02'],\n  ['lava','Lava Glow','#2E0B0B','#FF5A36','#140404'],['galaxy','Galaxy','#170F3A','#C39BFF','#0A0620'],['reef','Glow Reef','#062A2A','#3DFFD8','#021414'],\n  ['candy','Candy Neon','#3A0B2E','#FF9AE8','#1A0414'],['storm','Thunder','#141A26','#FFE14D','#080B12'],['ranger','Red Ranger','#2E0A0A','#FF3D3D','#140404'],\n  ['blue','Blue Ranger','#0A1640','#3D8BFF','#050A20'],['green','Green Ranger','#0A2E14','#3DFF6E','#04140A'],['pink','Pink Ranger','#3A0A2A','#FF5CC8','#180412'],\n  ['yellow','Yellow Ranger','#2E2A0A','#FFF03D','#141204'],['black','Black Ranger','#121212','#E6E6E6','#060606'],['frog','Frog Pond','#0E2A1B','#A8D84C','#06140C'],\n  ['mint','Mint Glow','#0A2A22','#8CFFD2','#04140F'],['sunset','Neon Sunset','#2E0E1E','#FFB347','#14040C'],['matrix','Matrix','#041004','#00FF41','#020802']\n].map(a => ({ id: a[0], name: a[1], header: a[2], accent: a[3], bg: a[4] }));\nconst POSITIVE_NOTES = ['Great job!', 'Awesome work!', 'Keep it up!', 'Fantastic effort!', 'Way to go!'];\nconst NEGATIVE_NOTES = ['Maybe next time.', \"Let's bounce back tomorrow.\", 'Everyone has an off day.', 'Small steps forward.'];\nfunction feedbackFor(delta) {\n  if (delta > 0) return POSITIVE_NOTES[Math.abs(delta) % POSITIVE_NOTES.length];\n  if (delta < 0) return NEGATIVE_NOTES[Math.abs(delta) % NEGATIVE_NOTES.length];\n  return 'Steady as you go.';\n}\nfunction softTint(hex) {\n  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);\n  const mix = c => Math.round(c * 0.14 + 255 * 0.86);\n  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';\n}\nfunction bestTextOn(hex) {\n  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);\n  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#17251C' : '#FFFFFF';\n}\nconst AI_PROMPT = 'Convert the student roster below into this exact JSON format. Keep class names as given. Do not add extra fields. Output ONLY the JSON, nothing else:\\n\\n{\\n  \"classes\": [\\n    {\\n      \"className\": \"Period 3\",\\n      \"students\": [\"John Smith\", \"Maria Garcia\", \"Alex Chen\"]\\n    }\\n  ]\\n}\\n\\nRoster to convert:\\n[PASTE ROSTER HERE]';\nconst FORMAT_EXAMPLE = '{\\n  \"classes\": [\\n    {\\n      \"className\": \"Period 3\",\\n      \"students\": [\"First Last\", \"First Last\", \"First Last\"]\\n    },\\n    {\\n      \"className\": \"Period 5\",\\n      \"students\": [\"First Last\", \"First Last\"]\\n    }\\n  ]\\n}';\nconst STEPS = { '+5 / +10': [5,10], '+1 / +5': [1,5], '+10 / +25': [10,25] };\nconst SIZES = { S: { title: 15, intro: 10, body: 10.5, tiny: 8, box: 11 }, M: { title: 19, intro: 12, body: 13, tiny: 9.5, box: 13 }, L: { title: 25, intro: 14.5, body: 16, tiny: 11, box: 16 } };\nconst PRINT_GRID = { 1: '1fr', 2: '1fr', 3: '1fr', 4: '1fr 1fr', 6: '1fr 1fr' };\nconst PRINT_ROWS = { 1: '1fr', 2: '1fr 1fr', 3: '1fr 1fr 1fr', 4: '1fr 1fr', 6: '1fr 1fr 1fr' };\n\n/* Rosters are pasted in and saved to 2F'],['L6','#E17716'],['L1','#E8CC0D'],['L2','#25854A'],['L3','#146BA4'],['L4','#702179']],\n  [['G3','#BA1D1E'],['G4','#E0781A'],['G5','#EACE12'],['G6','#25854B'],['G1','#186DA7'],['G2','#6F217A']]\n];\nconst DOT_MAP = {}; DOT_ROWS.forEach(r => r.forEach(d => { DOT_MAP[d[0]] = { id: d[0], color: d[1] }; }));\nfunction dotFor(name) { const d = DOT_MAP[String(name || '').trim().toUpperCase()]; if (!d) return null; const r = window.__resources || {}; return { color: d.color, src: r['dot' + d.id] || 'assets/dots/' + d.id + '.webp' }; }\nfunction teamNames(n) {\n  const seq = ['S1','S2','S3','S4','S5','S6','L1','L2','L3','L4','L5','L6','G1','G2','G3','G4','G5','G6'];\n  return Array.from({ length: n }, (_, i) => seq[i] || 'Team ' + (i + 1));\n}\n\nconst HEADER_H = 132;\nfunction headerH() {\n  try { const h = document.querySelector('header'); return h ? Math.round(h.getBoundingClientRect().height) + 12 : HEADER_H; }\n  catch (e) { return HEADER_H; }\n}\nfunction today() { return new Date().toISOString().slice(0, 10); }\nfunction STARTER_CLASSES() { return []; }\nfunction STARTER_CHECKED() { return {}; }\nfunction firstName(n) { return (n || '').trim().split(/\\s+/)[0].toLowerCase(); }\n/* Display name: first name + last initial only. Handles \"Last, First\" and \"First Last\". */\nfunction displayName(raw) {\n  const s = String(raw || '').trim();\n  if (!s) return '';\n  if (s.indexOf(',') >= 0) return shortName(s);\n  const w = s.split(/\\s+/);\n  if (w.length === 1) return w[0];\n  const last = w[w.length - 1].replace(/[^A-Za-z]/g, '');\n  return w[0] + (last ? ' ' + last.charAt(0).toUpperCase() + '.' : '');\n}\n/* Uploaded pictures carry their own crop: pan offset, zoom and frame height. */\nfunction normImg(v) {\n  if (typeof v === 'string') return { url: v, scale: 1, x: 0, y: 0, h: 220 };\n  const o = v || {};\n  return { url: o.url || '', scale: o.scale || 1, x: o.x || 0, y: o.y || 0, h: o.h || 220 };\n}\n\nclass Component extends DCLogic {\n  constructor(props) {
